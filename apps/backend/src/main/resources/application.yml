server:
  port: ${PORT:8080}
  error:
    include-message: always

spring:
  application:
    name: shopsmart-backend
  config:
    # Lets `./mvnw spring-boot:run` pick up the monorepo root .env (and an optional backend-local one).
    import:
      - optional:file:../../.env[.properties]
      - optional:file:.env[.properties]
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

  # ---- Supabase Postgres (pgvector enabled) ----
  # Use the Supabase *Session pooler* (port 5432) or direct connection string.
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
      connection-timeout: 20000
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: public

  # ---- Spring AI: NVIDIA API (OpenAI-compatible) ----
  ai:
    model:
      # Chat goes through the OpenAI client pointed at NVIDIA.
      # Embeddings use our own NvidiaEmbeddingModel (needs input_type), so the OpenAI ones are off.
      embedding: none
      image: none
      audio:
        speech: none
        transcription: none
      moderation: none
    openai:
      base-url: ${NVIDIA_BASE_URL:https://integrate.api.nvidia.com}
      api-key: ${NVIDIA_API_KEY:missing-key}
      chat:
        options:
          model: ${NVIDIA_AGENT_MODEL:nvidia/nemotron-3-super-120b-a12b}
          temperature: 0.2
          # NVIDIA API rejects requests without an explicit max token count.
          max-tokens: ${NVIDIA_MAX_TOKENS:2048}
    vectorstore:
      pgvector:
        initialize-schema: false   # Flyway owns the vector_store table
        table-name: vector_store
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: ${EMBEDDING_DIMENSIONS:1024}

shopsmart:
  ai:
    fast-model: ${NVIDIA_FAST_MODEL:nvidia/nemotron-3.5-lightning-30b-a3b}
    embedding:
      base-url: ${NVIDIA_BASE_URL:https://integrate.api.nvidia.com}
      api-key: ${NVIDIA_API_KEY:missing-key}
      model: ${NVIDIA_EMBEDDING_MODEL:nvidia/embed-qa-4}
      dimensions: ${EMBEDDING_DIMENSIONS:1024}
      # Send the `dimensions` field only for models with Matryoshka support (e.g. llama-nemotron-embed-1b-v2).
      send-dimensions: ${EMBEDDING_SEND_DIMENSIONS:false}
      batch-size: 50
  security:
    jwt-secret: ${JWT_SECRET}
    jwt-ttl-minutes: ${JWT_TTL_MINUTES:720}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.shopsmart: INFO
