# Whole stack: `docker compose -f infra/docker-compose.yml up --build` → http://localhost:3000
# Uses Supabase from ../.env by default. Add `--profile local-db` for an offline Postgres + pgvector
# (then set DB_URL=jdbc:postgresql://postgres:5432/shopsmart, DB_USERNAME/DB_PASSWORD=shopsmart in .env).
name: shopsmart

services:
  backend:
    build: ../apps/backend
    env_file: ../.env
    environment:
      KNOWLEDGE_STORAGE_DIR: /data/knowledge
    volumes:
      - knowledge:/data/knowledge
    ports:
      - "8080:8080"
    restart: unless-stopped

  frontend:
    build: ../apps/frontend
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    restart: unless-stopped

  postgres:
    profiles: ["local-db"]
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: shopsmart
      POSTGRES_USER: shopsmart
      POSTGRES_PASSWORD: shopsmart
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
  knowledge:
