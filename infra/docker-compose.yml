# Whole stack: `docker compose -f infra/docker-compose.yml up --build` → http://localhost:3000
# By default it starts a local MongoDB (Atlas Local image: replica set + Atlas Search + Vector Search).
# To use MongoDB Atlas instead, set MONGODB_URI in ../.env and run only `api` and `frontend`.
name: shopsmart

services:
  mongo:
    image: mongodb/mongodb-atlas-local:8.0
    environment:
      MONGODB_INITDB_ROOT_USERNAME: shopsmart
      MONGODB_INITDB_ROOT_PASSWORD: shopsmart
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
      - mongoconfig:/data/configdb
    restart: unless-stopped

  api:
    build: ../apps/api
    env_file: ../.env
    environment:
      MONGODB_URI: ${MONGODB_URI:-mongodb://shopsmart:shopsmart@mongo:27017/?directConnection=true&authSource=admin}
      KNOWLEDGE_STORAGE_DIR: /data/knowledge
    depends_on:
      - mongo
    volumes:
      - knowledge:/data/knowledge
    ports:
      - "8080:8080"
    restart: unless-stopped

  frontend:
    build: ../apps/frontend
    depends_on:
      - api
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    restart: unless-stopped

volumes:
  mongodata:
  mongoconfig:
  knowledge:
